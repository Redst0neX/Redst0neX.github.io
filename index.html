<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CyberStats</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#050816;
  color:white;
  font-family:'Orbitron',sans-serif;
  overflow-x:hidden;
}

/* BACKGROUND */

.bg-grid{
  position:fixed;
  inset:0;

  background-image:
  linear-gradient(rgba(0,255,255,0.05) 1px, transparent 1px),
  linear-gradient(90deg, rgba(0,255,255,0.05) 1px, transparent 1px);

  background-size:40px 40px;
  z-index:-2;
}

.glow{
  position:fixed;
  width:500px;
  height:500px;
  border-radius:50%;
  filter:blur(120px);
  z-index:-1;
}

.glow.one{
  top:-100px;
  left:-100px;
  background:rgba(0,255,255,0.12);
}

.glow.two{
  bottom:-100px;
  right:-100px;
  background:rgba(255,0,255,0.12);
}

/* HEADER */

header{
  padding:25px 50px;
  display:flex;
  justify-content:space-between;
  align-items:center;

  border-bottom:
  1px solid rgba(255,255,255,0.08);

  backdrop-filter:blur(10px);
}

.logo{
  font-size:32px;
  font-weight:900;
  color:#00ffff;

  text-shadow:
  0 0 10px #00ffff,
  0 0 30px #00ffff;
}

nav{
  display:flex;
  gap:25px;
}

nav a{
  color:#94a3b8;
  text-decoration:none;
  transition:0.25s;
}

nav a:hover{
  color:#00ffff;
}

/* HERO */

.hero{
  text-align:center;
  padding:90px 20px 50px;
}

.hero h1{
  font-size:68px;
  margin-bottom:20px;

  text-shadow:
  0 0 20px #00ffff;
}

.hero p{
  color:#94a3b8;
  margin-bottom:40px;
}

/* SEARCH */

.search-container{
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
}

.search-container input{
  width:420px;
  max-width:90%;

  padding:18px;

  border:none;
  outline:none;

  border-radius:18px;

  background:
  rgba(15,23,42,0.8);

  color:white;

  border:
  1px solid rgba(0,255,255,0.25);

  box-shadow:
  0 0 20px rgba(0,255,255,0.15);
}

.search-container input:focus{
  border-color:#00ffff;

  box-shadow:
  0 0 30px rgba(0,255,255,0.5);
}

.search-container button{
  padding:18px 30px;

  border:none;

  border-radius:18px;

  cursor:pointer;

  color:white;
  font-weight:bold;

  background:
  linear-gradient(45deg,#00ffff,#ff00ff);

  transition:0.25s;

  box-shadow:
  0 0 25px rgba(0,255,255,0.4);
}

.search-container button:hover{
  transform:translateY(-4px);

  box-shadow:
  0 0 35px rgba(255,0,255,0.7);
}

/* RESULT */

#result{
  display:flex;
  justify-content:center;
  padding:40px 20px;
}

/* PROFILE */

.profile{
  width:900px;
  max-width:95%;

  background:
  rgba(15,23,42,0.8);

  border-radius:28px;

  padding:35px;

  border:
  1px solid rgba(0,255,255,0.2);

  backdrop-filter:blur(12px);

  animation:fade 0.35s ease;
}

.top{
  display:flex;
  gap:30px;
  flex-wrap:wrap;
}

.avatar{
  width:130px;
  height:130px;

  border-radius:50%;

  border:3px solid #00ffff;

  box-shadow:
  0 0 30px rgba(0,255,255,0.7);
}

.user-info{
  flex:1;
}

.user-info h2{
  font-size:42px;
  margin-bottom:12px;

  color:#00ffff;

  text-shadow:
  0 0 15px #00ffff;
}

.user-info p{
  margin:10px 0;
  color:#cbd5e1;
}

/* PROJECTS */

.projects{
  margin-top:40px;
}

.projects h2{
  margin-bottom:20px;
  color:#00ffff;
}

.project-grid{
  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(250px,1fr));

  gap:18px;
}

.project{
  background:
  rgba(255,255,255,0.04);

  border-radius:20px;

  overflow:hidden;

  border:
  1px solid rgba(255,255,255,0.08);

  transition:0.25s;
}

.project:hover{
  transform:translateY(-5px);

  border-color:#00ffff;

  box-shadow:
  0 0 20px rgba(0,255,255,0.25);
}

.project img{
  width:100%;
  height:160px;
  object-fit:cover;
}

.project-content{
  padding:18px;
}

.project-content h3{
  margin-bottom:10px;
}

.project-content p{
  color:#94a3b8;
  font-size:14px;
}

/* ANIM */

@keyframes fade{

  from{
    opacity:0;
    transform:translateY(15px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

/* MOBILE */

@media(max-width:700px){

  .hero h1{
    font-size:42px;
  }

  header{
    flex-direction:column;
    gap:20px;
  }

  nav{
    flex-wrap:wrap;
    justify-content:center;
  }

}

</style>
</head>

<body>

<div class="bg-grid"></div>

<div class="glow one"></div>
<div class="glow two"></div>

<header>

  <div class="logo">
    CYBERSTATS
  </div>

  <nav>
    <a href="#">Accueil</a>
    <a href="#">Profils</a>
    <a href="#">Projets</a>
    <a href="#">API</a>
  </nav>

</header>

<section class="hero">

  <h1>SCRATCH NETWORK</h1>

  <p>
    Recherche de profils Scratch en temps réel
  </p>

  <div class="search-container">

    <input
      type="text"
      id="searchInput"
      placeholder="Entrer un pseudo Scratch..."
    >

    <button onclick="searchUser()">
      SEARCH
    </button>

  </div>

</section>

<div id="result"></div>

<script>

async function searchUser(){

  const username =
  document.getElementById("searchInput")
  .value
  .trim();

  const result =
  document.getElementById("result");

  if(username === ""){

    result.innerHTML = `
      <div class="profile">
        <p>Entre un pseudo.</p>
      </div>
    `;

    return;
  }

  result.innerHTML = `
    <div class="profile">
      <p>Connexion à Scratch...</p>
    </div>
  `;

  try{

    /* USER */

    const userResponse = await fetch(
      `https://api.scratch.mit.edu/users/${username}`
    );

    if(!userResponse.ok){
      throw new Error();
    }

    const user =
    await userResponse.json();

    /* PROJECTS */

    const projectsResponse = await fetch(
      `https://api.scratch.mit.edu/users/${username}/projects?limit=6`
    );

    const projects =
    await projectsResponse.json();

    result.innerHTML = `

      <div class="profile">

        <div class="top">

          <img
            class="avatar"

            src="
            https://uploads.scratch.mit.edu/get_image/user/${user.id}_200x200.png
            "
          >

          <div class="user-info">

            <h2>${user.username}</h2>

            <p>
              ID : ${user.id}
            </p>

            <p>
              Pays :
              ${user.profile.country || "Inconnu"}
            </p>

            <p>
              Bio :
              ${user.profile.bio || "Aucune bio"}
            </p>

            <p>
              Statut :
              ${user.profile.status || "Aucun statut"}
            </p>

            <p>
              Scratch Team :
              ${user.scratchteam ? "Oui" : "Non"}
            </p>

            <p>
              Créé le :
              ${new Date(user.history.joined)
              .toLocaleDateString()}
            </p>

          </div>

        </div>

        <div class="projects">

          <h2>PROJETS RÉCENTS</h2>

          <div class="project-grid">

            ${projects.map(project => `

              <div class="project">

                <img
                  src="
                  https://uploads.scratch.mit.edu/get_image/project/${project.id}_480x360.png
                  "
                >

                <div class="project-content">

                  <h3>
                    ${project.title}
                  </h3>

                  <p>
                    ❤️ ${project.stats.loves}
                    • ⭐ ${project.stats.favorites}
                    • 👁️ ${project.stats.views}
                  </p>

                </div>

              </div>

            `).join("")}

          </div>

        </div>

      </div>

    `;

  } catch(error){

    result.innerHTML = `
      <div class="profile">
        <p>Utilisateur introuvable.</p>
      </div>
    `;
  }

}

document
.getElementById("searchInput")
.addEventListener("keypress", function(e){

  if(e.key === "Enter"){
    searchUser();
  }

});

</script>

</body>
</html>

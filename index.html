<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ScratchViews</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#0f172a;
  color:white;
}

/* HEADER */

header{
  background:#111827;
  border-bottom:1px solid #1f2937;

  padding:20px 40px;

  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:28px;
  font-weight:800;
  color:#38bdf8;
}

nav{
  display:flex;
  gap:25px;
}

nav a{
  color:#94a3b8;
  text-decoration:none;
  transition:0.2s;
}

nav a:hover{
  color:white;
}

/* HERO */

.hero{
  text-align:center;
  padding:80px 20px 60px;
}

.hero h1{
  font-size:58px;
  margin-bottom:15px;
}

.hero p{
  color:#94a3b8;
  font-size:18px;
  margin-bottom:35px;
}

/* SEARCH */

.search{
  display:flex;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}

.search input{
  width:400px;
  max-width:90%;

  padding:16px;

  border:none;
  outline:none;

  border-radius:14px;

  background:#1e293b;

  color:white;

  font-size:16px;
}

.search button{
  padding:16px 24px;

  border:none;

  border-radius:14px;

  background:#38bdf8;

  color:white;

  font-weight:bold;

  cursor:pointer;

  transition:0.2s;
}

.search button:hover{
  opacity:0.8;
}

/* PROFILE */

#result{
  display:flex;
  justify-content:center;

  padding:20px;
}

.profile{
  width:950px;
  max-width:95%;

  background:#111827;

  border:1px solid #1f2937;

  border-radius:22px;

  padding:35px;

  animation:fade 0.3s ease;
}

.top{
  display:flex;
  gap:25px;
  flex-wrap:wrap;
}

.avatar{
  width:120px;
  height:120px;
  border-radius:50%;
}

.user-info{
  flex:1;
}

.user-info h2{
  font-size:42px;
  margin-bottom:12px;
}

.user-info p{
  color:#94a3b8;
  margin:8px 0;
}

/* STATS */

.stats{
  margin-top:35px;

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(180px,1fr));

  gap:18px;
}

.stat{
  background:#1e293b;

  border-radius:18px;

  padding:25px;

  border:1px solid #334155;

  transition:0.2s;
}

.stat:hover{
  transform:translateY(-4px);
}

.stat h3{
  color:#94a3b8;
  margin-bottom:12px;
}

.number{
  font-size:34px;
  font-weight:bold;
  color:#38bdf8;
}

/* PROJECTS */

.projects{
  margin-top:40px;
}

.projects h2{
  margin-bottom:20px;
}

.project-grid{
  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(240px,1fr));

  gap:18px;
}

.project{
  background:#1e293b;

  border-radius:18px;

  overflow:hidden;

  border:1px solid #334155;

  transition:0.2s;
}

.project:hover{
  transform:translateY(-5px);
}

.project img{
  width:100%;
  height:150px;
  object-fit:cover;
}

.project-content{
  padding:18px;
}

.project-content h3{
  margin-bottom:10px;
}

.project-content p{
  color:#94a3b8;
  font-size:14px;
}

/* FOOTER */

footer{
  padding:35px;
  text-align:center;
  color:#64748b;
}

/* ANIMATION */

@keyframes fade{

  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

/* MOBILE */

@media(max-width:700px){

  .hero h1{
    font-size:40px;
  }

  header{
    flex-direction:column;
    gap:18px;
  }

  nav{
    flex-wrap:wrap;
    justify-content:center;
  }

}

</style>
</head>

<body>

<header>

  <div class="logo">
    ScratchViews
  </div>

  <nav>
    <a href="#">Accueil</a>
    <a href="#">Classements</a>
    <a href="#">Stats</a>
    <a href="#">API</a>
  </nav>

</header>

<section class="hero">

  <h1>Scratch Statistics</h1>

  <p>
    Recherche des profils Scratch et affiche tes propres statistiques
  </p>

  <div class="search">

    <input
      type="text"
      id="searchInput"
      placeholder="Entrer un pseudo Scratch..."
    >

    <button onclick="searchUser()">
      Rechercher
    </button>

  </div>

</section>

<div id="result"></div>

<footer>
  © 2026 ScratchViews
</footer>

<script>

/*
========================================
STATS MANUELLES
MODIFIE ICI
========================================
*/

const customStats = {

  followers: "152 430",
  loves: "8.2M",
  favorites: "4.7M",
  views: "29.1M",

};

/*
========================================
RECHERCHE UTILISATEUR
========================================
*/

async function searchUser(){

  const username =
  document.getElementById("searchInput")
  .value
  .trim();

  const result =
  document.getElementById("result");

  if(username === ""){

    result.innerHTML = `
      <div class="profile">
        <p>Entre un pseudo.</p>
      </div>
    `;

    return;
  }

  result.innerHTML = `
    <div class="profile">
      <p>Chargement...</p>
    </div>
  `;

  try{

    /* USER */

    const userResponse = await fetch(
      `https://api.scratch.mit.edu/users/${username}`
    );

    if(!userResponse.ok){
      throw new Error();
    }

    const user =
    await userResponse.json();

    /* PROJECTS */

    const projectResponse = await fetch(
      `https://api.scratch.mit.edu/users/${username}/projects?limit=6`
    );

    const projects =
    await projectResponse.json();

    /* RENDER */

    result.innerHTML = `

      <div class="profile">

        <div class="top">

          <img
            class="avatar"

            src="
            https://uploads.scratch.mit.edu/get_image/user/${user.id}_200x200.png
            "
          >

          <div class="user-info">

            <h2>${user.username}</h2>

            <p>
              ID : ${user.id}
            </p>

            <p>
              Pays :
              ${user.profile.country || "Inconnu"}
            </p>

            <p>
              Bio :
              ${user.profile.bio || "Aucune bio"}
            </p>

            <p>
              Statut :
              ${user.profile.status || "Aucun statut"}
            </p>

            <p>
              Créé le :
              ${new Date(user.history.joined)
              .toLocaleDateString()}
            </p>

          </div>

        </div>

        <!-- STATS MANUELLES -->

        <div class="stats">

          <div class="stat">
            <h3>FOLLOWERS</h3>
            <div class="number">
              ${customStats.followers}
            </div>
          </div>

          <div class="stat">
            <h3>LOVES</h3>
            <div class="number">
              ${customStats.loves}
            </div>
          </div>

          <div class="stat">
            <h3>FAVORITES</h3>
            <div class="number">
              ${customStats.favorites}
            </div>
          </div>

          <div class="stat">
            <h3>VIEWS</h3>
            <div class="number">
              ${customStats.views}
            </div>
          </div>

        </div>

        <!-- PROJETS -->

        <div class="projects">

          <h2>Projets récents</h2>

          <div class="project-grid">

            ${projects.map(project => `

              <div class="project">

                <img
                  src="
                  https://uploads.scratch.mit.edu/get_image/project/${project.id}_480x360.png
                  "
                >

                <div class="project-content">

                  <h3>
                    ${project.title}
                  </h3>

                  <p>
                    ❤️ ${project.stats.loves}
                    • ⭐ ${project.stats.favorites}
                    • 👁️ ${project.stats.views}
                  </p>

                </div>

              </div>

            `).join("")}

          </div>

        </div>

      </div>

    `;

  } catch(error){

    result.innerHTML = `
      <div class="profile">
        <p>Utilisateur introuvable.</p>
      </div>
    `;
  }

}

/* ENTER */

document
.getElementById("searchInput")
.addEventListener("keypress", function(e){

  if(e.key === "Enter"){
    searchUser();
  }

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ScratchViews</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>

body{
  margin:0;
  font-family:Inter, sans-serif;
  background:#0f172a;
  color:white;
}

/* HEADER */

header{
  background:#111827;
  padding:20px 40px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #1f2937;
}

.logo{
  font-size:26px;
  font-weight:800;
  color:#38bdf8;
}

nav a{
  color:#94a3b8;
  margin-left:20px;
  text-decoration:none;
}

nav a:hover{
  color:white;
}

/* HERO */

.hero{
  text-align:center;
  padding:60px 20px 30px;
}

.hero h1{
  font-size:48px;
  margin-bottom:10px;
}

.hero p{
  color:#94a3b8;
}

/* SEARCH */

.search{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:25px;
  flex-wrap:wrap;
}

.search input{
  padding:14px;
  width:320px;
  border-radius:10px;
  border:none;
  background:#1e293b;
  color:white;
  outline:none;
}

.search button{
  padding:14px 18px;
  border:none;
  border-radius:10px;
  background:#38bdf8;
  color:white;
  cursor:pointer;
}

.search button:hover{
  opacity:0.85;
}

/* RESULT */

#result{
  display:flex;
  justify-content:center;
  margin-top:25px;
}

.card{
  width:850px;
  max-width:95%;
  background:#111827;
  border:1px solid #1f2937;
  border-radius:18px;
  padding:25px;
}

.top{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.avatar{
  width:110px;
  height:110px;
  border-radius:50%;
}

.info h2{
  margin:0;
  font-size:32px;
  color:#38bdf8;
}

.info p{
  margin:6px 0;
  color:#94a3b8;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;
  margin-top:25px;
}

.stat{
  background:#1e293b;
  padding:15px;
  border-radius:12px;
  text-align:center;
}

.stat h3{
  margin:0;
  font-size:13px;
  color:#94a3b8;
}

.stat div{
  font-size:20px;
  margin-top:5px;
  color:#38bdf8;
  font-weight:bold;
}

/* LEADERBOARD */

.leaderboard{
  width:850px;
  max-width:95%;
  margin:40px auto;
}

.user{
  background:#111827;
  border:1px solid #1f2937;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
}

/* FOOTER */

footer{
  text-align:center;
  padding:30px;
  color:#64748b;
  margin-top:40px;
}

</style>
</head>

<body>

<header>
  <div class="logo">ScratchViews</div>
  <nav>
    <a href="#">Accueil</a>
    <a href="#">Classement</a>
  </nav>
</header>

<div class="hero">
  <h1>Scratch Stats</h1>
  <p>Recherche de profils Scratch + stats personnalisées</p>

  <div class="search">
    <input id="input" placeholder="Pseudo Scratch">
    <button onclick="search()">Rechercher</button>
  </div>
</div>

<div id="result"></div>

<div class="leaderboard">

  <h2>Leaderboard</h2>

  <div id="board"></div>

</div>

<footer>
  © ScratchViews
</footer>

<script>

/* =========================
   STATS MANUELLES
========================= */

const statsDB = {

  griffpatch: { followers: "758 672", loves: "187" },
  ScratchCat: { followers: "167 280", loves: "109" },
  griffpatch_tutor: { followers: "135 906", loves: "40" },
  Will_Wam: { followers: "123 854", loves: "11" },
  ceebee: { followers: "87 599", loves: "29" }

};

/* =========================
   SEARCH
========================= */

async function search(){

  const u = document.getElementById("input").value.trim();
  const r = document.getElementById("result");

  if(!u){
    r.innerHTML = "<div class='card'>Entre un pseudo</div>";
    return;
  }

  r.innerHTML = "<div class='card'>Chargement...</div>";

  try{

    const res = await fetch(`https://api.scratch.mit.edu/users/${u}`);
    if(!res.ok) throw new Error();

    const user = await res.json();
    const stats = statsDB[u] || { followers:"0", loves:"0" };

    r.innerHTML = `
      <div class="card">

        <div class="top">

          <img class="avatar"
          src="https://uploads.scratch.mit.edu/get_image/user/${user.id}_200x200.png">

          <div class="info">

            <h2>${user.username}</h2>

            <p>ID: ${user.id}</p>
            <p>Pays: ${user.profile.country || "?"}</p>
            <p>Bio: ${user.profile.bio || "aucune"}</p>
            <p>Créé: ${new Date(user.history.joined).toLocaleDateString()}</p>

          </div>

        </div>

        <div class="stats">

          <div class="stat">
            <h3>Followers</h3>
            <div>${stats.followers}</div>
          </div>

          <div class="stat">
            <h3>Loves</h3>
            <div>${stats.loves}</div>
          </div>

        </div>

      </div>
    `;

  }catch(e){
    r.innerHTML = "<div class='card'>Utilisateur introuvable</div>";
  }

}

/* =========================
   LEADERBOARD
========================= */

const board = document.getElementById("board");

board.innerHTML = Object.keys(statsDB).map(u => `
  <div class="user">
    <span>${u}</span>
    <span>${statsDB[u].followers} followers</span>
  </div>
`).join("");

</script>

</body>
</html>

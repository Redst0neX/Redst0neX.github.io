<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Compte à rebours</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 1rem;

      transition: background 0.3s;
    }

    body.dark {
      background: #0f0f1a;
    }

    canvas#particles {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 0;
      pointer-events: none;
    }

    .toggle-btn {
      position: fixed;
      top: 16px;
      right: 16px;

      z-index: 10;

      padding: 8px 16px;

      border-radius: 20px;
      border: 1px solid #ddd;

      background: white;

      font-size: 13px;
      cursor: pointer;

      display: flex;
      align-items: center;
      gap: 6px;

      box-shadow: 0 2px 8px rgba(0,0,0,0.08);

      transition: all 0.3s;
    }

    body.dark .toggle-btn {
      background: #1e1e2e;
      border-color: #444;
      color: #eee;
    }

    .card {
      width: 100%;
      max-width: 720px;

      background: white;

      border-radius: 24px;
      overflow: hidden;

      position: relative;
      z-index: 1;

      box-shadow: 0 2px 20px rgba(0,0,0,0.08);

      transition:
        background 0.3s,
        box-shadow 0.3s;

      animation: fadeIn 0.8s ease;
    }

    body.dark .card {
      background: #1e1e2e;
      box-shadow: 0 2px 24px rgba(0,0,0,0.45);
    }

    .banner {
      height: 140px;

      background:
        linear-gradient(
          135deg,
          #4C97FF,
          #9966FF
        );

      position: relative;
    }

    .banner::after {
      content: "";

      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at top right,
          rgba(255,255,255,0.25),
          transparent 35%
        ),

        radial-gradient(
          circle at bottom left,
          rgba(255,255,255,0.15),
          transparent 40%
        );
    }

    .content {
      padding: 2rem;
      text-align: center;
    }

    .title {
      font-size: 2rem;
      font-weight: 700;

      color: #1a1a1a;

      margin-bottom: 0.5rem;
    }

    body.dark .title {
      color: #f0f0f0;
    }

    .subtitle {
      color: #777;

      font-size: 15px;

      margin-bottom: 2rem;
    }

    body.dark .subtitle {
      color: #aaa;
    }

    .countdown-grid {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 14px;

      margin-bottom: 2rem;
    }

    .time-box {
      background: #f7f9ff;

      border: 1px solid #eef0ff;
      border-radius: 18px;

      padding: 1.4rem 1rem;

      transition:
        transform 0.2s,
        background 0.3s;
    }

    .time-box:hover {
      transform: translateY(-3px);
    }

    body.dark .time-box {
      background: #2a2a3e;
      border-color: #3a3a4e;
    }

    .flip-card {
      position: relative;

      height: 60px;

      perspective: 1000px;
    }

    .flip-inner {
      position: relative;

      width: 100%;
      height: 100%;

      transform-style: preserve-3d;
    }

    .flip-inner.animate {
      animation: flip 0.7s ease;
    }

    .flip-face {
      position: absolute;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 2.4rem;
      font-weight: 700;

      color: #4C97FF;

      backface-visibility: hidden;
    }

    body.dark .flip-face {
      color: #8cbcff;
    }

    .flip-back {
      transform: rotateX(180deg);
    }

    @keyframes flip {

      0% {
        transform: rotateX(0deg);
      }

      100% {
        transform: rotateX(-180deg);
      }
    }

    .label {
      margin-top: 10px;

      font-size: 13px;
      color: #888;

      text-transform: uppercase;
      letter-spacing: 1px;
    }

    body.dark .label {
      color: #aaa;
    }

    .target-date {
      font-size: 14px;
      color: #666;

      padding-top: 1rem;

      border-top: 1px solid #f0f0f0;
    }

    body.dark .target-date {
      color: #aaa;
      border-color: #2e2e3e;
    }

    .finished {
      font-size: 2rem;
      font-weight: 700;

      color: #4C97FF;

      padding: 2rem 0;
    }

    @media (max-width: 640px) {

      .countdown-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .title {
        font-size: 1.7rem;
      }

      .flip-face {
        font-size: 2rem;
      }
    }

    @keyframes fadeIn {

      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

  </style>
</head>

<body class="dark">

  <canvas id="particles"></canvas>

  <button
    class="toggle-btn"
    onclick="toggleDark()"
    id="darkBtn"
  >
    ☀️ Mode clair
  </button>

  <div class="card">

    <div class="banner"></div>

    <div class="content">

      <h1 class="title">
        Compte à rebours
      </h1>

      <div class="subtitle">
        Jusqu’au 26 juin 2026 à 17h10
      </div>

      <div class="countdown-grid" id="countdown">

        <!-- JOURS -->
        <div class="time-box">
          <div class="flip-card">
            <div class="flip-inner" id="days-inner">
              <div class="flip-face" id="days-front">0</div>
              <div class="flip-face flip-back" id="days-back">0</div>
            </div>
          </div>
          <div class="label">Jours</div>
        </div>

        <!-- HEURES -->
        <div class="time-box">
          <div class="flip-card">
            <div class="flip-inner" id="hours-inner">
              <div class="flip-face" id="hours-front">00</div>
              <div class="flip-face flip-back" id="hours-back">00</div>
            </div>
          </div>
          <div class="label">Heures</div>
        </div>

        <!-- MINUTES -->
        <div class="time-box">
          <div class="flip-card">
            <div class="flip-inner" id="minutes-inner">
              <div class="flip-face" id="minutes-front">00</div>
              <div class="flip-face flip-back" id="minutes-back">00</div>
            </div>
          </div>
          <div class="label">Minutes</div>
        </div>

        <!-- SECONDES -->
        <div class="time-box">
          <div class="flip-card">
            <div class="flip-inner" id="seconds-inner">
              <div class="flip-face" id="seconds-front">00</div>
              <div class="flip-face flip-back" id="seconds-back">00</div>
            </div>
          </div>
          <div class="label">Secondes</div>
        </div>

      </div>

      <div class="target-date">
        Date cible : 26/06/2026 — 17:10
      </div>

    </div>

  </div>

  <script>

    // ========= MODE SOMBRE =========

    let darkMode = true;

    function toggleDark() {

      darkMode = !darkMode;

      document.body.classList.toggle(
        'dark',
        darkMode
      );

      document.getElementById(
        'darkBtn'
      ).textContent =
        darkMode
          ? '☀️ Mode clair'
          : '🌙 Mode sombre';

      initParticles();
    }

    // ========= FLIP =========

    function flipNumber(id, newValue) {

      const inner =
        document.getElementById(`${id}-inner`);

      const front =
        document.getElementById(`${id}-front`);

      const back =
        document.getElementById(`${id}-back`);

      if (
        front.textContent === String(newValue)
      ) {
        return;
      }

      back.textContent = newValue;

      inner.classList.remove('animate');

      void inner.offsetWidth;

      inner.classList.add('animate');

      setTimeout(() => {

        front.textContent = newValue;

        inner.classList.remove('animate');

      }, 700);
    }

    // ========= COMPTE À REBOURS =========

    const targetDate =
      new Date('2026-06-26T17:10:00');

    function updateCountdown() {

      const now = new Date();

      const diff = targetDate - now;

      if (diff <= 0) {

        document.getElementById(
          'countdown'
        ).innerHTML = `
          <div class="finished">
            🎉 Le compte à rebours est terminé !
          </div>
        `;

        return;
      }

      const days = Math.floor(
        diff / (1000 * 60 * 60 * 24)
      );

      const hours = Math.floor(
        (diff % (1000 * 60 * 60 * 24))
        / (1000 * 60 * 60)
      );

      const minutes = Math.floor(
        (diff % (1000 * 60 * 60))
        / (1000 * 60)
      );

      const seconds = Math.floor(
        (diff % (1000 * 60))
        / 1000
      );

      flipNumber(
        'days',
        days
      );

      flipNumber(
        'hours',
        String(hours).padStart(2, '0')
      );

      flipNumber(
        'minutes',
        String(minutes).padStart(2, '0')
      );

      flipNumber(
        'seconds',
        String(seconds).padStart(2, '0')
      );
    }

    setInterval(updateCountdown, 1000);

    updateCountdown();

    // ========= PARTICULES =========

    function initParticles() {

      const canvas =
        document.getElementById('particles');

      const ctx =
        canvas.getContext('2d');

      canvas.width =
        window.innerWidth;

      canvas.height =
        window.innerHeight;

      const color = darkMode
        ? '108,99,255'
        : '76,151,255';

      const particles = Array.from(
        { length: 80 },
        () => ({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,

          r: Math.random() * 2 + 1,

          dx: (Math.random() - 0.5) * 0.5,
          dy: (Math.random() - 0.5) * 0.5,

          a: Math.random() * 0.4 + 0.1
        })
      );

      function draw() {

        ctx.clearRect(
          0,
          0,
          canvas.width,
          canvas.height
        );

        particles.forEach(p => {

          ctx.beginPath();

          ctx.arc(
            p.x,
            p.y,
            p.r,
            0,
            Math.PI * 2
          );

          ctx.fillStyle =
            `rgba(${color}, ${p.a})`;

          ctx.fill();

          p.x += p.dx;
          p.y += p.dy;

          if (
            p.x < 0 ||
            p.x > canvas.width
          ) {
            p.dx *= -1;
          }

          if (
            p.y < 0 ||
            p.y > canvas.height
          ) {
            p.dy *= -1;
          }
        });

        window._raf =
          requestAnimationFrame(draw);
      }

      if (window._raf) {
        cancelAnimationFrame(window._raf);
      }

      draw();
    }

    window.addEventListener(
      'resize',
      initParticles
    );

    initParticles();

  </script>

</body>
</html>
